name: Publish ARC Restore

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-restore-release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - run: pip install ziglang cargo-zigbuild
      - name: Build and validate the IPK
        run: |
          sh scripts/build-watcher.sh
          sh scripts/package.sh
          version=$(node -p "require('./app/appinfo.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          npx --yes --package @webos-tools/cli@3.2.6 ares-package -i "build/org.arc-restore.app_${version}_all.ipk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" "build/org.arc-restore.app_${VERSION}_all.ipk" \
            --target "$GITHUB_SHA" --title "ARC Restore $VERSION" \
            --notes "Native, event-driven watcher: reacts to Bluetooth disconnects as they happen instead of polling every 2 seconds. Falls back to the shell watcher if the native one cannot run."
