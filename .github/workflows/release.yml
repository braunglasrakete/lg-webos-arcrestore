name: Publish ARC Restore

# Run from the Actions tab after bumping the version in app/appinfo.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-restore-release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - run: pip install ziglang cargo-zigbuild
      - name: Build, package and write the Homebrew Channel manifest
        env:
          ARC_RESTORE_REPO: ${{ github.repository }}
        run: |
          cargo xtask ipk
          cargo xtask release-manifest
          npx --yes --package @webos-tools/cli@3.2.6 ares-package -i build/*.ipk
          echo "VERSION=$(node -p "require('./app/appinfo.json').version")" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" build/*.ipk build/*.manifest.json build/repo.json \
            --target "$GITHUB_SHA" --title "ARC Restore $VERSION" --generate-notes
