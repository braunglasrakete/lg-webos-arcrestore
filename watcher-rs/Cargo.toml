[package]
name = "arc-restore-watcher"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Event-driven Sound Out watcher for ARC Restore on rooted LG webOS TVs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
